$version: 0.1.0
$learn_more: http://data-dict.tidyverse.org/

name: Posit open source devrel metrics
description: >-
  Daily adoption and engagement metrics for Posit's open source projects,
  collected by velocirepo from CRAN, PyPI, Plausible (website analytics),
  OpenVSX, YouTube, GitHub, and the opensource.posit.co RSS feeds, plus a
  catalog of the things behind those numbers (GitHub issues and pull
  requests, repos, YouTube videos, blog posts, and site entities) in
  `content`. Time series run from as early as 2008 (GitHub events) through
  yesterday; the `meta` table records the exact as-of date. This is public
  data about public projects.
details: >-
  Metric naming carries the core rule: `daily_*` values are per-day amounts
  and sum safely across days; `total_*` values are cumulative snapshots and
  must never be summed across days — read them from `metrics_filled` (which
  carries the last known value forward to every day) or take
  {{net_increase}} over a date range. Route questions accordingly: governed
  metrics and filters first (call_metrics, or {{name}} tokens in SQL);
  `metrics` for daily series; `metrics_filled` for anything `total_*`;
  `indicators` for pre-computed 28-day growth and trend; `events` when
  per-user or per-timestamp detail matters; `content` for the titles, text,
  authors, and states behind the counts ("which issues", "what did we
  publish"); `projects` to resolve project names. Sources count differently
  (e.g. CRAN and PyPI treat mirrors, caching, and bots differently), so
  compare levels across sources with caution. A metric series starting on
  some date usually means collection started then, not that the project
  launched then. A few repos and sites are tracked under more than one
  project id with duplicated values — never aggregate across projects
  without the {{deduplicated}} filter. GitHub star history is missing
  entirely from this snapshot (see the `stars` glossary entry); star
  questions cannot be answered. The current agent database includes a known
  upstream month-end compaction defect: it is missing eight July RSS
  total_items snapshots and nine July GitHub events (vip: 4, chatlas: 2,
  shiny-issue-triage: 2, py-shiny-site: 1). Do not use July total_items for
  RSS-feed growth, and describe July GitHub activity for those projects as
  slightly undercounted. RSS content rows are unaffected.

version:
  date: '2026-08-10'

tables:
  - name: metrics
    description: >-
      Unified daily time series across all sources. One row per project x
      source x target x metric x date (x page, video_id, or ref, for
      per-page, per-video, and per-issue series). Includes GitHub daily
      counts derived from the `events` table.
    details: >-
      Coverage varies by source: CRAN daily downloads since 2012-10 (13
      packages), PyPI daily downloads since 2025-06 (8 packages), Plausible
      website analytics since 2021-12 (16 sites), OpenVSX totals since
      2026-01 (6 extensions), YouTube totals since 2026-06-25 (one channel,
      1,518 videos), GitHub daily event counts since 2009 (~350 repos),
      GitHub total_reactions per issue/PR since 2026-07-27, and RSS
      total_items for the five opensource.posit.co feeds since 2026-07-27.

      YouTube total_* values are cumulative lifetime snapshots collected
      after 2026-06-25. They cannot reconstruct views, likes, or comments
      earned before collection began, or performance within an earlier
      calendar period. Use metrics_filled for a coherent value on a given
      date or the latest value.

      A 2026-07-28 refetch upstream damaged GitHub coverage in two ways that
      have not been repaired. Every star event was dropped, so there are no
      `daily_stars` rows at all; say so rather than substituting forks or
      another metric. And 22 repos lost their GitHub history entirely,
      including three prominent ones — posit-dev/positron,
      quarto-dev/quarto-cli, and rstudio/rstudio — so those projects now
      have only website or extension metrics. Check which sources cover a
      project before reading a GitHub silence as inactivity.

      Plausible rows need care. daily_pageviews/daily_visitors/daily_visits
      rows with `page IS NULL` (2021-12-08 to 2026-06-22) are SITE-level;
      rows with `page IS NOT NULL` (since 2026-03-02) are per-page, so both
      shapes share a metric name from 2026-03-02 to 2026-06-22 — filter on
      `page` before aggregating across that window or values double-count.
      daily_site_* rows are site-level and begin 2026-06-23 (2026-03-02 for
      shiny.posit.co). The {{site_traffic}} and {{page_traffic}} filters
      are the governed way through all of this. Per-page pageviews sum
      exactly to site pageviews; per-page visitors do NOT sum to site
      visitors (visitors deduplicate across pages).

      devrel-io switched collection systems on 2026-06-23, which still
      splits the Plausible site-level series in two (see above), but the
      GitHub event series were refetched over their full history on
      2026-07-28 and now run continuously: issue and PR comments are one
      `daily_comments` series through yesterday, and issue-close counts no
      longer undercount after mid-2026. The CRAN series is missing ~7
      scattered days over the last two years (days where cranlogs hadn't
      yet published when the daily fetch ran; they are never backfilled),
      so range sums slightly undercount and can differ from cranlogs' own
      current totals.

      total_reactions is per issue/PR, not per project: one row per
      (project, target, ref) carrying that issue's or PR's reaction count,
      backfilled for every open and closed item on 2026-07-27 and updated
      only for items touched since. Read the latest value per ref (or use
      metrics_filled) and join to `content` on project, target, and ref for
      titles; a single-day sum silently covers only the items fetched that
      day. Most items have zero reactions.

      Some targets are tracked under multiple project ids with DUPLICATED
      values: rstudio/shiny events appear under both `shiny` and `shiny-r`;
      posit-dev/py-shiny under `py-shiny` and `shiny-python`;
      posit-dev/orbital under `orbital`, `orbital-r`, and `orbital-python`;
      posit-dev/pointblank under `pointblank` and `pointblank-python`; the
      posit/shiny OpenVSX extension and the shiny.posit.co Plausible site
      under both `shiny-python` and `shiny-r`. Sums across projects must
      count each (source, target) once — apply the {{deduplicated}} filter,
      which keeps the shared extension and site under `shiny-python`. The
      copies can disagree slightly on a few days (collection-timing noise,
      worst for shiny.posit.co just after the 2026-06-23 seam). For a
      single project, prefer the curated id (`shiny-r`, `shiny-python`,
      `orbital-r`, `orbital-python`, `pointblank-python`); for
      shiny.posit.co traffic specifically, query project `shiny-python` or
      the target directly.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        examples: [dplyr, quarto, shiny-python, positron]
        description: Project id.
      - name: source
        type: enum
        values: [cran, pypi, plausible, openvsx, youtube, github, rss]
        description: Collection source.
      - name: target
        type: string
        examples: [dplyr, dplyr.tidyverse.org, tidyverse/dplyr, posit/air-vscode]
        description: >-
          Source-specific identifier: CRAN/PyPI package name, Plausible
          domain, GitHub repo slug, OpenVSX extension id, YouTube channel
          handle, or RSS feed URL.
      - name: metric
        type: enum
        values:
          daily_downloads: package downloads that day (cran, pypi)
          daily_pageviews: pageviews; site-level when page IS NULL, per-page otherwise (plausible)
          daily_visitors: unique visitors; same page rule (plausible)
          daily_visits: visits/sessions; same page rule (plausible)
          daily_site_pageviews: site-wide pageviews, since 2026-03-02 (plausible)
          daily_site_visitors: site-wide unique visitors, since 2026-03-02 (plausible)
          daily_site_visits: site-wide visits, since 2026-03-02 (plausible)
          daily_forks: forks created that day
          daily_issues_opened: issues opened that day
          daily_issues_closed: issues closed that day
          daily_prs_opened: PRs opened that day
          daily_prs_merged: PRs merged that day
          daily_comments: issue and PR comments that day, one combined series
          total_reactions: reactions on one issue or PR, keyed by ref (github)
          total_items: items in an RSS feed (rss)
          total_downloads: cumulative extension downloads (openvsx)
          total_ratings: average extension rating multiplied by 100 (openvsx)
          total_reviews: cumulative review count (openvsx)
          total_views: cumulative views per video (youtube)
          total_likes: cumulative likes per video (youtube)
          total_comments: cumulative comments per video (youtube)
          total_channel_views: cumulative channel views (youtube)
          total_subscribers: channel subscribers, rounded by the API (youtube)
          total_videos: videos on the channel (youtube)
      - name: date
        type: date
        description: The day the value describes (UTC).
      - name: value
        type: number(quantity)
        description: Metric value; daily amount or cumulative snapshot per the metric name.
      - name: page
        type: string
        examples: [/, /py/docs/overview.html]
        description: >-
          URL path for per-page Plausible rows (since 2026-03-02); NULL for
          every other row, including site-level Plausible rows.
      - name: video_id
        type: string
        constraints: [foreign_key]
        description: >-
          YouTube video id for per-video rows; NULL for every other row.
      - name: ref
        type: number(quantity)
        description: >-
          GitHub issue or PR number for total_reactions rows; NULL for every
          other row. Joins to content.ref within a project and target.
    definitions:
      # Provenance: duplicate-target audit of the data, 2026-07-24
      # (SELECT source, target ... HAVING COUNT(DISTINCT project) > 1).
      # Keeper choices: curated ids win; the shared posit/shiny extension
      # and shiny.posit.co site stay under shiny-python, whose Plausible
      # series is continuous (shiny-r's has a gap-producing row shape
      # before the seam).
      - name: deduplicated
        label: apply to any cross-project aggregate
        description: >-
          Counts each tracked thing exactly once. A few repos and sites are
          recorded under more than one project id with duplicated values;
          this keeps one copy of each. Apply to any aggregate that spans
          projects (leaderboards, totals across Posit).
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')
          AND NOT (project = 'shiny-r' AND target IN ('posit/shiny', 'shiny.posit.co'))
      # Provenance: era audit 2026-07-24. Untagged site rows end 2026-06-22
      # and daily_site_* begins 2026-06-23 for every site except
      # shiny.posit.co (daily_site_* from 2026-03-02 under shiny-python),
      # so the eras never overlap within a kept project and no date clamp
      # is needed; the one cross-project overlap is deduplicated's job.
      - name: site_traffic
        label: site-level rows, both collection eras
        description: >-
          Site-level website analytics rows across both collection eras.
          Use with traffic_metric so the eras aggregate under one metric
          name, and with deduplicated (one site is tracked under two
          project ids whose rows would otherwise double-count).
        expr: >-
          source = 'plausible'
          AND ((page IS NULL
                AND metric IN ('daily_pageviews', 'daily_visitors', 'daily_visits'))
               OR metric LIKE 'daily_site_%')
      - name: page_traffic
        label: per-page rows, since 2026-03-02
        description: >-
          Per-page website analytics rows. Per-page data starts 2026-03-02;
          earlier page-level questions cannot be answered.
        expr: page IS NOT NULL
      - name: pre_seam
        label: before the 2026-06-23 collection seam
        description: >-
          Rows collected before the 2026-06-23 collection-system migration,
          where the original site-level Plausible rows (page IS NULL) end.
          Use when a question needs one Plausible collection era only.
        expr: date <= '2026-06-22'
      - name: traffic_metric
        label: canonical site-metric name across eras
        description: >-
          The canonical website metric name: maps the newer daily_site_*
          names onto daily_pageviews/daily_visitors/daily_visits so the two
          collection eras aggregate under one name.
        expr: >-
          CASE
            WHEN metric = 'daily_site_pageviews' THEN 'daily_pageviews'
            WHEN metric = 'daily_site_visitors' THEN 'daily_visitors'
            WHEN metric = 'daily_site_visits' THEN 'daily_visits'
            ELSE metric
          END
      - name: cran_downloads
        description: >-
          CRAN package downloads, deduplicated. Includes automated traffic
          (mirrors, CI, caching); indicates scale and trend, not user counts.
          The series is missing ~13 scattered days, so range sums slightly
          undercount. Do not combine with pypi_downloads: the registries have
          different counting semantics.
        expr: >-
          SUM(CASE WHEN source = 'cran'
            AND metric = 'daily_downloads' AND deduplicated
            THEN value ELSE 0 END)
      - name: pypi_downloads
        description: >-
          PyPI package downloads, deduplicated and excluding known mirrors.
          Includes automated traffic (CI and caching); indicates scale and
          trend, not user counts. Do not combine with cran_downloads: the
          registries have different counting semantics.
        expr: >-
          SUM(CASE WHEN source = 'pypi'
            AND metric = 'daily_downloads' AND deduplicated
            THEN value ELSE 0 END)
      - name: pageviews
        description: >-
          Site-level pageviews across both collection eras, deduplicated.
        expr: >-
          SUM(CASE WHEN site_traffic
            AND traffic_metric = 'daily_pageviews' AND deduplicated
            THEN value ELSE 0 END)
      - name: visitors
        label: visitor-days, not distinct people
        description: >-
          Sum of DAILY unique visitors, site-level, both eras, deduplicated.
          Daily uniques do not deduplicate across days, so a range total
          overstates distinct people; present as visitor-days or a daily
          average.
        expr: >-
          SUM(CASE WHEN site_traffic
            AND traffic_metric = 'daily_visitors' AND deduplicated
            THEN value ELSE 0 END)
      - name: visits
        description: >-
          Site-level visits/sessions across both collection eras,
          deduplicated.
        expr: >-
          SUM(CASE WHEN site_traffic
            AND traffic_metric = 'daily_visits' AND deduplicated
            THEN value ELSE 0 END)

  - name: metrics_filled
    description: >-
      Like metrics, but with total_* snapshot series forward-filled to every
      day. The table to use for any total_* question.
    details: >-
      velocirepo only writes a total_* row when the value changes, so the raw
      metrics table is sparse (e.g. total_subscribers is rounded by the
      YouTube API and can sit unchanged for weeks). Here the last known value
      is carried forward to each day through the most recent fetch, so "the
      value on date X" and "current value" queries are correct. daily_*
      rows pass through unchanged and are NOT gap-filled.

      total_reactions is filled per issue/PR (project x target x ref), which
      is the reliable way to read reaction counts: the raw metrics table
      only carries a row on the day an item was fetched.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        description: Project id.
      - name: source
        type: enum
        values: [cran, pypi, plausible, openvsx, youtube, github, rss]
        description: Collection source.
      - name: target
        type: string
        description: Source-specific identifier, as in metrics.
      - name: metric
        type: string
        description: Same metric names as metrics.
      - name: date
        type: date
        description: Calendar day; for total_* every day is present.
      - name: value
        type: number(quantity)
        description: Last observed cumulative value as of that day (total_*), or the daily amount.
      - name: video_id
        type: string
        constraints: [foreign_key]
        description: >-
          YouTube video id for per-video series (total_views etc.); NULL
          otherwise.
      - name: page
        type: string
        description: URL path for per-page Plausible series; NULL otherwise.
      - name: ref
        type: number(quantity)
        description: >-
          GitHub issue or PR number for total_reactions series; NULL
          otherwise.
    definitions:
      # Same duplicate-target audit as metrics.deduplicated (2026-07-29).
      - name: deduplicated
        label: apply to any cross-project aggregate
        description: >-
          Counts each tracked thing exactly once; see metrics. Apply to any
          aggregate that spans projects.
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')
          AND NOT (project = 'shiny-r' AND target IN ('posit/shiny', 'shiny.posit.co'))
      - name: net_increase
        label: growth of a total_* over a date range
        description: >-
          How much a cumulative total_* value grew over the queried date
          range (last minus first, valid because totals only grow). The
          governed way to turn a total_* snapshot series into a change —
          e.g. OpenVSX downloads gained in a month. Constrain to one metric
          and group by project or video_id; never sum total_* values across
          days.
        expr: MAX(value) - MIN(value)

  - name: indicators
    description: >-
      Pre-computed momentum for every daily_* series: 28-day growth rate and
      28-day trend, one row per project x source x metric x date x indicator.
    details: >-
      growth_rate compares the trailing 28 observations against the 28
      before that ((sum_28d - sum_prior_28d) / sum_prior_28d); trend is the
      per-day regression slope over the trailing 28 observations. Windows
      are row-based, so where a series has missing days (CRAN) they span
      slightly more than 28 calendar days.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        description: Project id.
      - name: source
        type: enum
        values: [cran, pypi, plausible, github]
        description: >-
          Collection source. Only sources with daily_* series appear;
          OpenVSX, YouTube, and RSS report totals only.
      - name: target
        type: string
        description: >-
          Source-specific identifier, such as a repository, package, or site.
      - name: metric
        type: string
        description: >-
          The daily_* metric the indicator is computed over: downloads,
          Plausible traffic, or the GitHub activity series.
      - name: date
        type: date
        description: The day the trailing windows end.
      - name: indicator
        type: enum
        values: [growth_rate, trend]
        description: Which momentum statistic the row carries.
      - name: value
        type: number(quantity)
        description: >-
          growth_rate is a proportion (0.1 = up 10% vs the prior window);
          trend is the slope in metric units per day.
    definitions:
      # Same duplicate-target audit as metrics.deduplicated (2026-07-24).
      - name: deduplicated
        label: apply to any cross-project aggregate
        description: >-
          Counts each tracked thing exactly once; see metrics. Apply to any
          ranking or aggregate that spans projects, e.g. fastest-growing
          leaderboards.
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')
          AND NOT (project = 'shiny-r' AND target IN ('posit/shiny', 'shiny.posit.co'))

  - name: events
    description: >-
      Individual GitHub events since 2009 with timestamp, acting username,
      and the issue or PR number they happened on. Use for per-user or
      sub-daily detail; for counts over time, prefer the derived daily_*
      metrics.
    details: >-
      Join `ref` to content.ref (within a project and target) for the title,
      body, author, and state of the issue or PR an event happened on, so
      "which issues" questions are answerable here; fork events have no ref.
      There are no star events (see the `stars` glossary entry). Comment
      events are one `comment` type covering both issues and PRs. username
      is NULL for a few hundred events whose actor GitHub no longer reports
      (deleted accounts), and it is the ACTING user, not the issue's author
      — content.author is authorship. Some repos appear under two project
      ids with duplicated events (see metrics); apply the {{deduplicated}}
      filter when counting across projects.

      Formal package authorship and maintainer roles are not collected.
      Contributor events can be used only as a clearly labeled activity
      proxy; they do not establish that someone authored a package.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        description: Project id.
      - name: source
        type: enum
        values: [github]
        description: Collection source; always github.
      - name: target
        type: string
        examples: [tidyverse/dplyr, rstudio/shiny]
        description: GitHub repo slug.
      - name: type
        type: enum
        values: [fork, issue_open, issue_close, pr_open, pr_merge, comment]
        description: Event type; comment covers issue and PR comments alike.
      - name: datetime
        type: datetime
        description: Event timestamp, UTC.
      - name: ref
        type: number(quantity)
        constraints: [foreign_key]
        description: >-
          Issue or PR number the event happened on; NULL for fork events.
      - name: username
        type: string
        description: >-
          GitHub login of the acting user; NULL where GitHub no longer
          reports one.
    definitions:
      # Same duplicate-target audit as metrics.deduplicated (2026-07-29).
      - name: deduplicated
        label: apply to any cross-project aggregate
        description: >-
          Counts each event exactly once; a few repos record their events
          under two or three project ids (see metrics). Apply to any count
          that spans projects, including per-user contribution counts.
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')
          AND NOT (project = 'shiny-r' AND target IN ('posit/shiny', 'shiny.posit.co'))

  - name: projects
    description: >-
      One row per tracked project: id, display name, description, language
      tags, website. Use to resolve informal names ("Shiny for Python" ->
      shiny-python) before querying.
    details: >-
      466 projects are listed, but only ~20 curated ones have package/site
      metrics; the rest are GitHub-only repos across the posit-dev, rstudio,
      tidyverse, and quarto-dev orgs (68 have no metrics at all yet). Which
      sources cover a project is best read from the data, e.g.
      SELECT DISTINCT source FROM metrics WHERE project = 'ellmer'.

      Language/topic tags are sparse and are not a portfolio census. Derive
      broad rosters from observed sources and repository metadata rather than
      treating tagged projects as the complete set. This table does not carry
      source or target columns; derive those relationships from metrics,
      events, or content.
    columns:
      - name: id
        type: string
        constraints: [primary_key]
        examples: [dplyr, shiny-r, shiny-python, great-tables]
        description: Project id used as `project` throughout.
      - name: tags
        type: string
        examples: [r, python, typescript]
        description: Language/topic tags (list column).

  - name: content
    description: >-
      Catalog of the things the metrics count: GitHub issues, pull requests,
      and repos; @PositPBC YouTube videos; and the opensource.posit.co blog
      posts, resources, software entries, people, and events. One row per
      item, with title, body text, author, state, timestamps, and URL.
    details: >-
      Row counts by type: 51,175 GitHub issues and 42,162 PRs (from 2009,
      across ~350 repos, both open and closed), 462 GitHub repos, 1,711 site
      resources, 1,518 YouTube videos, 990 blog posts (from 2012), 368
      software entries, 173 people, 31 events. The `type` column is the way
      in; `source` (github, youtube, rss) is coarser.

      `description` and `content` hold full body text — issue and PR bodies,
      whole blog posts — so they are large. Search them with LIKE or
      selective columns; never SELECT them across many rows.

      Issues and PRs join to `events` and to total_reactions rows on
      (project, target, ref); YouTube videos join to per-video metrics on
      content.id = metrics.video_id. Issue and PR rows are duplicated under
      the alternate project ids described in metrics, so apply
      {{deduplicated}} to any count spanning projects.

      Content freshness differs from the metric as-of date: issues and PRs
      are re-upserted at each fetch, so state and updated_at reflect the
      fetch, not the snapshot date.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        description: Project id.
      - name: source
        type: enum
        values: [github, youtube, rss]
        description: Where the item came from.
      - name: type
        type: enum
        values:
          issue: GitHub issue
          pr: GitHub pull request
          repo: GitHub repository, one per tracked project
          video: YouTube video on @PositPBC
          post: opensource.posit.co blog post
          resource: site resource (video, talk, book, ...)
          software: site software entry, one per listed project
          person: site person page
          event: site event listing, including upcoming ones
        description: What kind of item the row describes.
      - name: target
        type: string
        examples: [tidyverse/dplyr, '@PositPBC']
        description: >-
          Repo slug, channel handle, or feed URL the item came from, as in
          metrics.
      - name: id
        type: string
        constraints: [primary_key]
        examples: [issue/7849, ML3q7Ok4hJg, blog/2026-07-23_ir-0-1-0]
        description: >-
          Source-specific id: 'issue/<n>' or 'pr/<n>' for GitHub, the video
          id for YouTube, the path-like slug for site entities.
      - name: ref
        type: number(quantity)
        constraints: [foreign_key]
        description: >-
          Issue or PR number; NULL for everything else.
      - name: title
        type: string
        description: Issue/PR title, video title, or page title.
      - name: description
        type: string
        description: >-
          Issue/PR body, video description, or the item's summary. Long
          text.
      - name: content
        type: string
        description: >-
          Full body text, populated for site posts, resources, software, and
          events only. Long text.
      - name: author
        type: string
        description: >-
          GitHub login that opened the issue or PR; NULL for other types.
      - name: state
        type: enum
        values: [OPEN, CLOSED, MERGED]
        description: >-
          Issue or PR state as of the last fetch (PRs use MERGED for merged,
          CLOSED for closed unmerged); NULL for other types.
      - name: published_at
        type: datetime
        description: >-
          When the item was opened or published; NULL for people and
          software pages. Site events use the event date, which can be in
          the future.
      - name: updated_at
        type: datetime
        description: When the item last changed, where the source reports it.
      - name: url
        type: string
        description: Link to the issue, PR, video, or page.
      - name: duration
        type: number(quantity)
        description: Video length in seconds; NULL for other types.
      - name: tags
        type: string
        description: Keyword list as text, e.g. for LIKE searches by topic.
      - name: extra
        type: string
        description: >-
          Leftover source-specific fields as JSON text, differing by type
          (repo language and license, event location and dates, resource
          view counts, person social links). Inspect a row before relying on
          a key.
    definitions:
      # Same duplicate-target audit as metrics.deduplicated (2026-07-29).
      - name: deduplicated
        label: apply to any cross-project aggregate
        description: >-
          Counts each item exactly once; a few repos file their issues and
          PRs under two or three project ids (see metrics). Apply to any
          count that spans projects.
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')

  - name: meta
    description: >-
      One row: as_of (the most recent metric date, normally yesterday) and
      built_at (when this database was materialized). Check it before
      answering "current"/"latest" questions and mention the as-of date when
      freshness matters.

relationships:
  - join: metrics.project = projects.id
    cardinality: many-to-one
  - join: metrics_filled.project = projects.id
    cardinality: many-to-one
  - join: indicators.project = projects.id
    cardinality: many-to-one
  - join: events.project = projects.id
    cardinality: many-to-one
  - join: content.project = projects.id
    cardinality: many-to-one
  - join: metrics.video_id = content.id
    cardinality: many-to-one
    description: YouTube per-video metrics to the video catalog.
  - join: metrics_filled.video_id = content.id
    cardinality: many-to-one
    description: >-
      Cumulative per-video series (total_views etc.) to the video catalog;
      the usual join for video leaderboards.
  - join: events.ref = content.ref
    cardinality: many-to-one
    description: >-
      Events to the issue or PR they happened on. Numbers repeat across
      repos, so match on project and target too.
  - join: metrics.ref = content.ref
    cardinality: many-to-one
    description: >-
      total_reactions rows to the issue or PR they count reactions for; also
      match on project and target.

glossary:
  project: >-
    A tracked open source project, identified by projects.id. The same
    project can be measured by several sources (e.g. querychat ships on
    both CRAN and PyPI; disambiguate with the source column).
  source vs target: >-
    source is where a number came from (cran, pypi, plausible, openvsx,
    youtube, github, rss); target is the source-specific identifier there
    (package name, domain, repo slug, extension id, channel handle, feed
    URL).
  daily_* vs total_*: >-
    daily_* is a per-day amount (summable); total_* is a cumulative
    snapshot (never sum across days; use metrics_filled or difference it).
  2026-06-23 migration seam: >-
    devrel-io switched collection systems that day. The original site-level
    Plausible rows (page IS NULL) end there and daily_site_* begins, so
    treat site-traffic trends that straddle mid-2026 with care (the
    site_traffic and traffic_metric definitions handle it). The GitHub
    series were refetched over full history afterward and no longer break
    at the seam.
  open-source-website: >-
    The project id for opensource.posit.co itself: its Plausible traffic,
    its five RSS feeds (total_items), and the blog posts, resources,
    software entries, people, and events those feeds carry in `content`.
  reactions: >-
    total_reactions counts emoji reactions on a single issue or PR, keyed
    by ref, backfilled once on 2026-07-27. It is not a project-level
    metric; aggregate it by taking the latest value per ref.
  posit: >-
    The project id for the @PositPBC YouTube channel itself, not a
    repository or package.
  positron: >-
    Positron is a desktop IDE distributed as installers, not an R/Python
    package, so it has no CRAN or PyPI downloads; download counts for it
    cannot be answered from this data. Its GitHub history was also lost in
    the 2026-07-28 refetch, leaving positron.posit.co website traffic as
    its only remaining signal.
  shiny.posit.co: >-
    The Shiny website, serving both the R and Python frameworks. It is
    tracked under both shiny-r and shiny-python with duplicated values;
    deduplicated keeps it under shiny-python, so query its traffic there
    (or by target), not under shiny-r.
  tidyverse: >-
    The `tidyverse` project is the tidyverse meta-package and the
    tidyverse/tidyverse repo, NOT a rollup of all tidyverse packages.
    "Downloads of the tidyverse" as a whole means summing the individual
    packages (dplyr, ggplot2, ...), each tracked as its own project.
  downloads: >-
    CRAN and PyPI download counts include automated traffic (mirrors, CI,
    caching) and each registry counts differently; they indicate scale and
    trend, not user counts, and are not directly comparable across
    registries. Group by source unless a question names one registry; do not
    silently present a combined total. PyPI counts here exclude known mirrors.
  package authorship: >-
    Formal package authorship and maintainer roles are not collected.
    GitHub event usernames describe public contribution activity, not package
    authorship, and may be used only as a clearly labeled proxy.
  stars: >-
    There is no star data. Every star event was dropped from the upstream
    devrel-io data in the 2026-07-28 refetch and collection has not resumed,
    so there are no star events and no daily_stars metric. Star questions —
    leaderboards, growth, totals — cannot be answered from this snapshot;
    say that plainly instead of substituting forks or another metric.
