$version: 0.1.0
$learn_more: http://data-dict.tidyverse.org/

name: Posit open source devrel metrics
description: >-
  Daily adoption and engagement metrics for Posit's open source projects,
  collected by velocirepo from CRAN, PyPI, Plausible (website analytics),
  OpenVSX, YouTube, and GitHub. Time series run from as early as 2008
  (GitHub events) through yesterday; the `meta` table records the exact
  as-of date. This is public data about public projects.
details: >-
  Metric naming carries the core rule: `daily_*` values are per-day amounts
  and sum safely across days; `total_*` values are cumulative snapshots and
  must never be summed across days — read them from `metrics_filled` (which
  carries the last known value forward to every day) or take
  {{net_increase}} over a date range. Route questions accordingly: governed
  metrics and filters first (query_metrics, or {{name}} tokens in SQL);
  `metrics` for daily series; `metrics_filled` for anything `total_*`;
  `indicators` for pre-computed 28-day growth and trend; `events` only when
  per-user or per-timestamp detail matters; `projects` to resolve project
  names. Sources count differently (e.g. CRAN and PyPI treat mirrors,
  caching, and bots differently), so compare levels across sources with
  caution. A metric series starting on some date usually means collection
  started then, not that the project launched then. A few repos and sites
  are tracked under more than one project id with duplicated values —
  never aggregate across projects without the {{deduplicated}} filter.

version:
  date: '2026-07-24'

tables:
  - name: metrics
    description: >-
      Unified daily time series across all sources. One row per project x
      source x target x metric x date (x page or video_id, for per-page and
      per-video series). Includes GitHub daily counts derived from the
      `events` table.
    details: >-
      Coverage varies by source: CRAN daily downloads since 2012-10 (13
      packages), PyPI daily downloads since 2025-06 (8 packages), Plausible
      website analytics since 2021-12 (16 sites), OpenVSX totals since
      2026-01 (6 extensions), YouTube totals since 2026-06-25 (one channel),
      GitHub daily event counts since 2008 (~420 repos).

      Plausible rows need care. daily_pageviews/daily_visitors/daily_visits
      rows with `page IS NULL` (2021-12-08 to 2026-06-22) are SITE-level;
      rows with `page IS NOT NULL` (since 2026-03-02) are per-page, so both
      shapes share a metric name from 2026-03-02 to 2026-06-22 — filter on
      `page` before aggregating across that window or values double-count.
      daily_site_* rows are site-level and begin 2026-06-23 (2026-03-02 for
      shiny.posit.co). The {{site_traffic}} and {{page_traffic}} filters
      are the governed way through all of this. Per-page pageviews sum
      exactly to site pageviews; per-page visitors do NOT sum to site
      visitors (visitors deduplicate across pages).

      devrel-io switched collection systems on 2026-06-23, and some GitHub
      series change behavior at that seam: daily_issue_comment and
      daily_pr_comment END at 2026-06-22 (frozen history), and
      daily_issues_closed (mildly: daily_prs_merged) systematically
      UNDERCOUNTS after the seam because closes are only recorded for
      recently-created issues. Avoid presenting issue-close trends across
      mid-2026. Star events currently lag other sources by ~2 days, and
      cumulative star sums drift from live GitHub counts by up to ~10%.
      The CRAN series is missing ~13 scattered days over the last two years
      (days where cranlogs hadn't yet published when the daily fetch ran;
      they are never backfilled), so range sums slightly undercount and can
      differ from cranlogs' own current totals.

      Some targets are tracked under multiple project ids with DUPLICATED
      values: rstudio/shiny events appear under both `shiny` and `shiny-r`;
      posit-dev/py-shiny under `py-shiny` and `shiny-python`;
      posit-dev/orbital under `orbital`, `orbital-r`, and `orbital-python`;
      posit-dev/pointblank under `pointblank` and `pointblank-python`; the
      posit/shiny OpenVSX extension and the shiny.posit.co Plausible site
      under both `shiny-python` and `shiny-r`. Sums across projects must
      count each (source, target) once — apply the {{deduplicated}} filter,
      which keeps the shared extension and site under `shiny-python`. The
      copies can disagree slightly on a few days (collection-timing noise,
      worst for shiny.posit.co just after the 2026-06-23 seam). For a
      single project, prefer the curated id (`shiny-r`, `shiny-python`,
      `orbital-r`, `orbital-python`, `pointblank-python`); for
      shiny.posit.co traffic specifically, query project `shiny-python` or
      the target directly.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        examples: [dplyr, quarto, shiny-python, positron]
        description: Project id.
      - name: source
        type: enum
        values: [cran, pypi, plausible, openvsx, youtube, github]
        description: Collection source.
      - name: target
        type: string
        examples: [dplyr, dplyr.tidyverse.org, tidyverse/dplyr, posit/air-vscode]
        description: >-
          Source-specific identifier: CRAN/PyPI package name, Plausible
          domain, GitHub repo slug, OpenVSX extension id, or YouTube channel
          handle.
      - name: metric
        type: enum
        values:
          daily_downloads: package downloads that day (cran, pypi)
          daily_pageviews: pageviews; site-level when page IS NULL, per-page otherwise (plausible)
          daily_visitors: unique visitors; same page rule (plausible)
          daily_visits: visits/sessions; same page rule (plausible)
          daily_site_pageviews: site-wide pageviews, since 2026-03-02 (plausible)
          daily_site_visitors: site-wide unique visitors, since 2026-03-02 (plausible)
          daily_site_visits: site-wide visits, since 2026-03-02 (plausible)
          daily_stars: GitHub stars gained that day, derived from events
          daily_forks: forks created that day
          daily_issues_opened: issues opened that day
          daily_issues_closed: issues closed that day; undercounts after 2026-06-22
          daily_prs_opened: PRs opened that day
          daily_prs_merged: PRs merged that day
          daily_issue_comment: issue comments; series ends 2026-06-22
          daily_pr_comment: PR comments; series ends 2026-06-22
          total_downloads: cumulative extension downloads (openvsx)
          total_ratings: cumulative rating count (openvsx)
          total_reviews: cumulative review count (openvsx)
          total_views: cumulative views per video (youtube)
          total_likes: cumulative likes per video (youtube)
          total_comments: cumulative comments per video (youtube)
          total_channel_views: cumulative channel views (youtube)
          total_subscribers: channel subscribers, rounded by the API (youtube)
          total_videos: videos on the channel (youtube)
      - name: date
        type: date
        description: The day the value describes (UTC).
      - name: value
        type: number(quantity)
        description: Metric value; daily amount or cumulative snapshot per the metric name.
      - name: page
        type: string
        examples: [/, /py/docs/overview.html]
        description: >-
          URL path for per-page Plausible rows (since 2026-03-02); NULL for
          every other row, including site-level Plausible rows.
      - name: video_id
        type: string
        constraints: [foreign_key]
        description: >-
          YouTube video id for per-video rows; NULL for every other row.
    definitions:
      # Provenance: duplicate-target audit of the data, 2026-07-24
      # (SELECT source, target ... HAVING COUNT(DISTINCT project) > 1).
      # Keeper choices: curated ids win; the shared posit/shiny extension
      # and shiny.posit.co site stay under shiny-python, whose Plausible
      # series is continuous (shiny-r's has a gap-producing row shape
      # before the seam).
      - name: deduplicated
        type: boolean
        label: apply to any cross-project aggregate
        description: >-
          Counts each tracked thing exactly once. A few repos and sites are
          recorded under more than one project id with duplicated values;
          this keeps one copy of each. Apply to any aggregate that spans
          projects (leaderboards, totals across Posit).
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')
          AND NOT (project = 'shiny-r' AND target IN ('posit/shiny', 'shiny.posit.co'))
      # Provenance: era audit 2026-07-24. Untagged site rows end 2026-06-22
      # and daily_site_* begins 2026-06-23 for every site except
      # shiny.posit.co (daily_site_* from 2026-03-02 under shiny-python),
      # so the eras never overlap within a kept project and no date clamp
      # is needed; the one cross-project overlap is deduplicated's job.
      - name: site_traffic
        type: boolean
        label: site-level rows, both collection eras
        description: >-
          Site-level website analytics rows across both collection eras.
          Use with traffic_metric so the eras aggregate under one metric
          name, and with deduplicated (one site is tracked under two
          project ids whose rows would otherwise double-count).
        expr: >-
          source = 'plausible'
          AND ((page IS NULL
                AND metric IN ('daily_pageviews', 'daily_visitors', 'daily_visits'))
               OR metric LIKE 'daily_site_%')
      - name: page_traffic
        type: boolean
        label: per-page rows, since 2026-03-02
        description: >-
          Per-page website analytics rows. Per-page data starts 2026-03-02;
          earlier page-level questions cannot be answered.
        expr: page IS NOT NULL
      - name: pre_seam
        type: boolean
        label: before the 2026-06-23 collection seam
        description: >-
          Rows collected before the 2026-06-23 collection-system migration.
          Clamp issue-close and comment trend questions here; those series
          break at the seam.
        expr: date <= '2026-06-22'
      - name: traffic_metric
        type: string
        label: canonical site-metric name across eras
        description: >-
          The canonical website metric name: maps the newer daily_site_*
          names onto daily_pageviews/daily_visitors/daily_visits so the two
          collection eras aggregate under one name.
        expr: >-
          CASE
            WHEN metric = 'daily_site_pageviews' THEN 'daily_pageviews'
            WHEN metric = 'daily_site_visitors' THEN 'daily_visitors'
            WHEN metric = 'daily_site_visits' THEN 'daily_visits'
            ELSE metric
          END
      # date_trunc is outside data-dict's expression grammar (its one
      # deviation here); kept because time axes are this agent's modal
      # question shape.
      - name: month
        type: date
        description: The row's calendar month, for monthly rollups.
        expr: CAST(date_trunc('month', date) AS DATE)
      - name: downloads
        type: number(quantity)
        description: >-
          Package downloads (CRAN + PyPI daily_downloads), deduplicated.
          Includes automated traffic (mirrors, CI, caching); indicates
          scale and trend, not user counts. The CRAN series is missing ~13
          scattered days, so range sums slightly undercount.
        expr: SUM(value) FILTER (WHERE metric = 'daily_downloads' AND deduplicated)
      - name: pageviews
        type: number(quantity)
        description: >-
          Site-level pageviews across both collection eras, deduplicated.
        expr: >-
          SUM(value) FILTER (WHERE site_traffic
            AND traffic_metric = 'daily_pageviews' AND deduplicated)
      - name: visitors
        type: number(quantity)
        label: visitor-days, not distinct people
        description: >-
          Sum of DAILY unique visitors, site-level, both eras, deduplicated.
          Daily uniques do not deduplicate across days, so a range total
          overstates distinct people; present as visitor-days or a daily
          average.
        expr: >-
          SUM(value) FILTER (WHERE site_traffic
            AND traffic_metric = 'daily_visitors' AND deduplicated)
      - name: visits
        type: number(quantity)
        description: >-
          Site-level visits/sessions across both collection eras,
          deduplicated.
        expr: >-
          SUM(value) FILTER (WHERE site_traffic
            AND traffic_metric = 'daily_visits' AND deduplicated)
      - name: stars_gained
        type: number(quantity)
        label: unbounded = current star total
        description: >-
          GitHub stars gained (sum of daily_stars), deduplicated. With no
          date constraint this is the current star total. Star counts are
          approximate: within ~10% of live GitHub, usually much closer,
          and star events lag other sources by ~2 days.
        expr: SUM(value) FILTER (WHERE metric = 'daily_stars' AND deduplicated)

  - name: metrics_filled
    description: >-
      Like metrics, but with total_* snapshot series forward-filled to every
      day. The table to use for any total_* question.
    details: >-
      velocirepo only writes a total_* row when the value changes, so the raw
      metrics table is sparse (e.g. total_subscribers is rounded by the
      YouTube API and can sit unchanged for weeks). Here the last known value
      is carried forward to each day through the most recent fetch, so "the
      value on date X" and "current value" queries are correct. daily_*
      rows pass through unchanged and are NOT gap-filled.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        description: Project id.
      - name: source
        type: enum
        values: [cran, pypi, plausible, openvsx, youtube, github]
        description: Collection source.
      - name: target
        type: string
        description: Source-specific identifier, as in metrics.
      - name: metric
        type: string
        description: Same metric names as metrics.
      - name: date
        type: date
        description: Calendar day; for total_* every day is present.
      - name: value
        type: number(quantity)
        description: Last observed cumulative value as of that day (total_*), or the daily amount.
      - name: video_id
        type: string
        constraints: [foreign_key]
        description: >-
          YouTube video id for per-video series (total_views etc.); NULL
          otherwise.
      - name: page
        type: string
        description: URL path for per-page Plausible series; NULL otherwise.
    definitions:
      # Same duplicate-target audit as metrics.deduplicated (2026-07-24).
      - name: deduplicated
        type: boolean
        label: apply to any cross-project aggregate
        description: >-
          Counts each tracked thing exactly once; see metrics. Apply to any
          aggregate that spans projects.
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')
          AND NOT (project = 'shiny-r' AND target IN ('posit/shiny', 'shiny.posit.co'))
      - name: net_increase
        type: number(quantity)
        label: growth of a total_* over a date range
        description: >-
          How much a cumulative total_* value grew over the queried date
          range (last minus first, valid because totals only grow). The
          governed way to turn a total_* snapshot series into a change —
          e.g. OpenVSX downloads gained in a month. Constrain to one metric
          and group by project or video_id; never sum total_* values across
          days.
        expr: MAX(value) - MIN(value)

  - name: indicators
    description: >-
      Pre-computed momentum for every daily_* series: 28-day growth rate and
      28-day trend, one row per project x source x metric x date x indicator.
    details: >-
      growth_rate compares the trailing 28 observations against the 28
      before that ((sum_28d - sum_prior_28d) / sum_prior_28d); trend is the
      per-day regression slope over the trailing 28 observations. Windows
      are row-based, so where a series has missing days (CRAN) they span
      slightly more than 28 calendar days.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        description: Project id.
      - name: source
        type: enum
        values: [cran, pypi, plausible, openvsx, youtube, github]
        description: Collection source.
      - name: metric
        type: string
        description: The daily_* metric the indicator is computed over.
      - name: date
        type: date
        description: The day the trailing windows end.
      - name: indicator
        type: enum
        values: [growth_rate, trend]
        description: Which momentum statistic the row carries.
      - name: value
        type: number(quantity)
        description: >-
          growth_rate is a proportion (0.1 = up 10% vs the prior window);
          trend is the slope in metric units per day.
    definitions:
      # Same duplicate-target audit as metrics.deduplicated (2026-07-24).
      - name: deduplicated
        type: boolean
        label: apply to any cross-project aggregate
        description: >-
          Counts each tracked thing exactly once; see metrics. Apply to any
          ranking or aggregate that spans projects, e.g. fastest-growing
          leaderboards.
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')
          AND NOT (project = 'shiny-r' AND target IN ('posit/shiny', 'shiny.posit.co'))

  - name: events
    description: >-
      Individual GitHub events since 2008 with timestamp and username. Use
      for per-user or sub-daily detail; for counts over time, prefer the
      derived daily_* metrics.
    details: >-
      Each event records only the acting username; there is no issue/PR
      number or title, so "which issues" questions cannot be answered, only
      "how many" and "by whom". Comment events end 2026-06-22, and
      issue_close undercounts after that date (see metrics). Some repos
      appear under two project ids with duplicated events (see metrics);
      apply the {{deduplicated}} filter when counting across projects.
    columns:
      - name: project
        type: string
        constraints: [foreign_key]
        description: Project id.
      - name: source
        type: enum
        values: [github]
        description: Collection source; always github.
      - name: target
        type: string
        examples: [tidyverse/dplyr, rstudio/shiny]
        description: GitHub repo slug.
      - name: type
        type: enum
        values: [star, fork, issue_open, issue_close, issue_comment, pr_open, pr_merge, pr_comment]
        description: Event type.
      - name: datetime
        type: string
        description: Event timestamp, UTC.
      - name: username
        type: string
        description: >-
          GitHub login of the acting user ('unknown' for some events).
    definitions:
      # Same duplicate-target audit as metrics.deduplicated (2026-07-24).
      - name: deduplicated
        type: boolean
        label: apply to any cross-project aggregate
        description: >-
          Counts each event exactly once; a few repos record their events
          under two or three project ids (see metrics). Apply to any count
          that spans projects, including per-user contribution counts.
        expr: >-
          project NOT IN ('shiny', 'py-shiny', 'orbital', 'pointblank')
          AND NOT (project = 'orbital-python' AND source = 'github')
          AND NOT (project = 'shiny-r' AND target IN ('posit/shiny', 'shiny.posit.co'))

  - name: projects
    description: >-
      One row per tracked project: id, display name, description, language
      tags, website. Use to resolve informal names ("Shiny for Python" ->
      shiny-python) before querying.
    details: >-
      466 projects are listed, but only ~20 curated ones have package/site
      metrics; the rest are GitHub-only repos across the posit-dev, rstudio,
      tidyverse, and quarto-dev orgs (49 have no data at all yet). Which
      sources cover a project is best read from the data, e.g.
      SELECT DISTINCT source FROM metrics WHERE project = 'ellmer'.
    columns:
      - name: id
        type: string
        constraints: [primary_key]
        examples: [dplyr, shiny-r, shiny-python, great-tables]
        description: Project id used as `project` throughout.
      - name: tags
        type: string
        examples: [r, python, typescript]
        description: Language/topic tags (list column).

  - name: content
    description: >-
      Catalog of the @PositPBC YouTube channel: one row per video with
      title, description, publish time, URL, and duration (seconds).
    details: >-
      Use metrics_filled for the cumulative per-video view counts.
    columns:
      - name: id
        type: string
        constraints: [primary_key]
        description: YouTube video id.
      - name: title
        type: string
        description: Video title.
      - name: published_at
        type: string
        description: Publish timestamp, UTC.
      - name: duration
        type: number(quantity)
        description: Video length in seconds.
      - name: tags
        type: string
        description: Keyword list as text, e.g. for LIKE searches by topic.

  - name: meta
    description: >-
      One row: as_of (the most recent metric date, normally yesterday) and
      built_at (when this database was materialized). Check it before
      answering "current"/"latest" questions and mention the as-of date when
      freshness matters.

relationships:
  - join: metrics.project = projects.id
    cardinality: many-to-one
  - join: metrics_filled.project = projects.id
    cardinality: many-to-one
  - join: indicators.project = projects.id
    cardinality: many-to-one
  - join: events.project = projects.id
    cardinality: many-to-one
  - join: metrics.video_id = content.id
    cardinality: many-to-one
    description: YouTube per-video metrics to the video catalog.
  - join: metrics_filled.video_id = content.id
    cardinality: many-to-one
    description: >-
      Cumulative per-video series (total_views etc.) to the video catalog;
      the usual join for video leaderboards.

glossary:
  project: >-
    A tracked open source project, identified by projects.id. The same
    project can be measured by several sources (e.g. querychat ships on
    both CRAN and PyPI; disambiguate with the source column).
  source vs target: >-
    source is where a number came from (cran, pypi, plausible, openvsx,
    youtube, github); target is the source-specific identifier there
    (package name, domain, repo slug, extension id, channel handle).
  daily_* vs total_*: >-
    daily_* is a per-day amount (summable); total_* is a cumulative
    snapshot (never sum across days; use metrics_filled or difference it).
  2026-06-23 migration seam: >-
    devrel-io switched collection systems that day. Comment events end
    2026-06-22, the original site-level Plausible rows (page IS NULL) end
    there, and issue-close counts undercount afterward. Treat trends that
    straddle mid-2026 for those series with suspicion.
  posit: >-
    The project id for the @PositPBC YouTube channel itself, not a
    repository or package.
  positron: >-
    Positron is a desktop IDE distributed as installers, not an R/Python
    package: it has GitHub and website metrics but no CRAN or PyPI
    downloads. Download counts for it cannot be answered from this data.
  shiny.posit.co: >-
    The Shiny website, serving both the R and Python frameworks. It is
    tracked under both shiny-r and shiny-python with duplicated values;
    deduplicated keeps it under shiny-python, so query its traffic there
    (or by target), not under shiny-r.
  tidyverse: >-
    The `tidyverse` project is the tidyverse meta-package and the
    tidyverse/tidyverse repo, NOT a rollup of all tidyverse packages.
    "Downloads of the tidyverse" as a whole means summing the individual
    packages (dplyr, ggplot2, ...), each tracked as its own project.
  downloads: >-
    CRAN and PyPI download counts include automated traffic (mirrors, CI,
    caching) and each registry counts differently; they indicate scale and
    trend, not user counts, and are not directly comparable across
    registries. PyPI counts here exclude known mirrors.
  stars: >-
    Star counts are derived from star events and approximate the live
    GitHub number (unstars and collection quirks put them within ~10%,
    usually much closer).
