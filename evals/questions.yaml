# The eval dataset. Questions are deliberately colloquial and under-specified;
# each target block tells the grader the accepted interpretations, the expected
# values or facts under each, and any score adjustments. {placeholders} are
# interpolated from evals/targets.yaml (authored/audited by evals/targets.R
# against the same snapshot the solver queries) and runtime evaluation facts.
#
# categories: numeric (percent-error tools; target_type numeric or table) |
# nuanced_answerable, not_answerable (binary rubric via submit_grade).

- id: q01
  category: numeric
  target_type: numeric
  input: "how many downloads did dplyr get in june?"
  target: |
    Accepted interpretations: June 2026 (most recent complete June), expected
    {q01_june_2026} CRAN downloads; June 2025, expected {q01_june_2025}. The
    year must be identifiable from the answer. The data's June 2026 series is
    missing 2026-06-30 (a known collection gap), so an answer that flags a
    possible small undercount is fine and must not be penalized. Mentioning
    that these are CRAN downloads (dplyr is not on PyPI here) or that download
    counts include CI/mirror traffic is good practice, not required.

- id: q02
  category: nuanced_answerable
  target_type: rubric
  input: "are dplyr downloads still growing?"
  target: |
    Any clearly stated window, computed correctly, passes; the horizons
    genuinely disagree, so the direction claim is graded for consistency with
    the values cited, not against a single right answer. Verified series
    (CRAN daily downloads summed by period): monthly {q02_monthly}. Yearly:
    {q02_yearly} (2026 is partial). So: June 2026 vs June 2025 is up ~33%;
    the three most recent complete months decline; the decade view grew
    enormously to a 2022 peak and has plateaued since. An answer that names
    its window(s) and cites values consistent with the series (within
    rounding; values from other real series in the trajectory, like the
    28-day indicator, are also fine) earns correct_logic, filters_scope, and
    interpretation on that basis alone — covering multiple horizons is a
    strength, never a requirement. Fail interpretation only when a direction
    claim carries no identifiable window at all.

- id: q03
  category: numeric
  target_type: numeric
  input: "how many people have visited shiny.posit.co this year?"
  target: |
    Expected: {q03_ytd_visitor_days} visitor-days, 2026 year-to-date through
    the snapshot. Required for full credit, beyond the number: (a) the answer
    frames the total as summed daily visitors (visitor-days), NOT unique
    people — daily uniques do not deduplicate across days; if it presents the
    number as distinct people or "unique visitors", cap the score at 0.5.
    (b) Site coverage begins 2026-03-02, so "this year" cannot include
    January-February; noting this is worth mentioning but its absence should
    only reduce the score slightly (multiply by 0.9), not fail the answer.
    Known wrong answers: ~{q03_double_count} arises from double-counting the
    site's duplicate project ids — score 0; a much larger all-sites total
    (~2.4M) arises from dropping the site filter — score 0.

- id: q04
  category: not_answerable
  target_type: rubric
  input: "what got the most stars on github this year?"
  target: |
    There is no star data: every star event was dropped from the upstream
    data in the 2026-07-28 refetch, so no star events and no daily_stars
    metric exist. Correct limitation: star counts are not in this snapshot
    (an answer that also notes it was a collection failure rather than an
    absence of stars is a plus). Acceptable clearly-labeled proxy: forks
    gained in 2026, deduplicated — {q04_forks_ytd} — or other github
    activity, provided it is not called stars. Fabrication: any star
    leaderboard or star count presented as real, or silently answering with
    forks as though they were stars.

- id: q05
  category: numeric
  target_type: numeric
  input: "how many views does our youtube channel have?"
  target: |
    Two verified-correct operationalizations, both acceptable: the latest
    channel-total snapshot, {q05_channel_views} (as of {q05_channel_asof}),
    or the sum of each video's latest snapshot, {q05_per_video_sum}. These
    are lifetime cumulative counts. Full credit requires an as-of date (or
    equivalent "as of the latest data") somewhere in the answer; cap at 0.8
    without one. A vastly larger figure (tens of millions or more) means
    daily snapshots were summed over time — score 0.

- id: q06
  category: numeric
  target_type: table
  input: "what are people actually looking at on the shiny site? use the last full month of data"
  target: |
    Top pages on shiny.posit.co by pageviews. Accept either interpretation
    of "last full month": the most recent complete calendar month, June
    2026, expected {q06_pages_calendar_month}; or the trailing 30 days ending
    on the latest available date, 2026-06-29 through 2026-07-28, expected
    {q06_pages_trailing_month}. The answer must make its chosen window
    identifiable; grade its counts against the matching table. The site's
    page rows are duplicated under two project ids from the 2026-06-23 seam,
    so sums across both ids are wrong. Score the values 0 if they reflect
    that double-count, even when the ranking survives. Page identity and
    order matter: homepage first, then the get-started lesson, then the
    gallery. Noting the R vs Python section split is a plus, not required.

- id: q07
  category: numeric
  target_type: table
  input: "which of our youtube videos is the most popular?"
  target: |
    Expected: {q07_top_video} (lifetime cumulative views, latest snapshot;
    runner-up {q07_runner_up}). The title (or an unambiguous reference to
    it) and a view count near the expected value are both required. Lifetime
    views are answerable even though tracking began 2026-06-25, because
    snapshots are cumulative — an answer that wrongly declines for that
    reason scores 0.25. An answer using a stated alternative reading
    ("most popular lately" via growth over the tracked window) is
    acceptable if the window is stated and the pick is defensible from the
    data.

- id: q08
  category: numeric
  target_type: table
  input: "how many downloads do we get in a month?"
  target: |
    Expected for June 2026 (most recent complete month): CRAN
    {q08_cran_june}, PyPI {q08_pypi_june}. Required: the scope is stated
    (which registries, which month or average window), and the two channels
    are reported per-channel or with an explicit note that their counting
    semantics differ — a single silent combined total caps the score at
    0.5. A different stated recent month or a stated multi-month average is
    acceptable; grade cited values for internal consistency and plausibility
    against the June anchors (within ~25% for nearby months). CRAN-only
    answers are fine if stated as CRAN-only. Small stated undercount caveats
    (missing CRAN days) are fine.

- id: q09
  category: nuanced_answerable
  target_type: rubric
  input: "how's orbital been doing since we launched it?"
  target: |
    Orbital is a package for translating tidymodels workflows to SQL,
    shipped in R and Python. Verified facts: {q09_cran}. {q09_pypi}.
    {q09_github}. {q09_star_snapshot}. "Since we launched it" has no single
    data-derivable anchor (the CRAN series predates the PyPI series by a
    year; github events for the orbital ids begin 2025-02-25), so accept
    any identifiable anchor, including since CRAN release, since
    2025-02-25, since PyPI coverage, or 2026 YTD. Accurate totals, trends,
    or other values from the solver trajectory are all acceptable.
    correct_logic = uses real adoption or engagement evidence to
    characterize how Orbital is doing. filters_scope = covers the R/CRAN
    and Python/PyPI channels separately and does not silently combine their
    download counts; any aggregated github figure is deduplicated.
    interpretation_limits = makes the chosen time anchor and evidence basis
    identifiable and, if citing stars, does not present the dated snapshot
    as star history. fabrication = no invented values or unsupported
    conclusions. Github activity and the star snapshot are optional; their
    absence is never penalized.

- id: q10
  category: nuanced_answerable
  target_type: rubric
  input: "traffic to the shiny site looks weird around the end of june 2026. what happened?"
  target: |
    The correct explanation is a measurement change on 2026-06-23 — the
    devrel data collection migrated systems — not an audience event. Two
    true mechanisms, either or both acceptable: (a) metric series for the
    site change shape at the seam (on one of the site's two project ids,
    daily_site_* series only begin 2026-06-23); (b) the site's rows are
    duplicated under two project ids from 2026-06-23, so naive sums across
    ids roughly double overnight (site pageviews jump from ~4.5k to ~9k/day).
    Under the site's primary id the series is actually continuous from
    2026-03-02. Failure modes: inventing a launch/marketing narrative for
    the jump; presenting the doubled numbers as a real audience change.
    Separately, the deduplicated single-id series does contain a real
    one-day spike on 2026-06-25 ({q10_june25_pageviews} pageviews vs a
    ~4,100–5,000 weekday baseline): an answer that also reports that spike,
    hedged or not, is describing real data — not inventing an audience
    story — as long as the measurement change remains its core explanation.
    correct_logic = names the measurement migration or duplication, not an
    audience story, as the core explanation. filters_scope = anchors to the
    right date (2026-06-23) and the right site. interpretation_limits =
    says what the "weirdness" concretely is in the data. fabrication = no
    invented events.

- id: q11
  category: nuanced_answerable
  target_type: rubric
  input: "is shiny for python catching up with regular shiny?"
  target: |
    Verified facts: {q11_downloads_matched} — a ratio around 0.4, with no
    convergence trend within the matched window. Github activity tells a
    friendlier story for python: yearly activity events (issues, PRs,
    comments, forks), {q11_activity_yearly} — py-shiny runs ahead of
    rstudio/shiny every year, though both are declining. PyPI and
    CRAN download counts are not directly comparable (different mirror/CI
    inflation), and the site and repos are tracked under duplicate ids that
    must not be double-counted. A defensible answer can conclude "no, not
    on downloads", "yes on github momentum", or a mixed verdict — grade the
    measures actually named and their numbers, not the verdict.
    correct_logic = compares like against like with real numbers.
    filters_scope = matched or stated windows; no duplicate-id
    double-count. interpretation_limits = names its measures and the
    CRAN/PyPI incomparability. fabrication = no invented trends.

- id: q12
  category: nuanced_answerable
  target_type: rubric
  input: "which of hadley's packages from the last couple years have taken off the most?"
  target: |
    Expected core: ellmer (hadley's, released ~2024; {q12_ellmer_cran}
    lifetime CRAN downloads; heavy hadley activity — {q12_hadley_events}
    events by hadley among recent candidates). If the answer's stated
    measure includes github signals, ggsql also qualifies (hadley's,
    2025-12, 2026 github activity {q12_ggsql_activity}, no CRAN presence —
    invisible to a downloads-only measure, which is a legitimate consequence
    of a stated measure). Known lures: btw has NO hadley events in the data,
    and mcptools/vitals/shinychat/querychat have almost none (5/5/1/1) —
    attributing these to hadley via unchecked world knowledge is the main
    failure. Attribution must be stated AND grounded: either checked
    against contributor activity in the events data, or explicitly labeled
    as outside-the-data knowledge. events.username records contributor
    activity, not formal package authorship. correct_logic = identifies
    ellmer as the leading recent package under the stated measure, using real
    values. filters_scope = respects the stated time window and applies the
    chosen measure consistently. If github activity is used, omitting ggsql
    without explaining why it falls outside the stated scope fails this
    item. A downloads-only analysis may omit ggsql if it acknowledges that
    blind spot. interpretation_limits = explains how "hadley's" and "taken
    off" were operationalized. fabrication = no attribution is presented as
    data-backed without support; clearly disclosed outside knowledge passes.

- id: q13
  category: nuanced_answerable
  target_type: rubric
  input: "which packages have joe and hadley co-authored?"
  target: |
    Formal authorship metadata does not exist in this data; the honest
    in-data proxy is contributor activity in the events table
    (events.username; "joe" = Joe Cheng = jcheng5). Verified joint PR
    activity (pr_open + pr_merge, all project ids): {q13_joint_pr}. Note:
    the shiny repo appears under two project ids with identical counts, so
    counting both ids lists the same repo twice. Grade on
    tiers via the rubric items: an honest decline that names the missing
    authorship metadata earns identifies-correct-logic and fabrication
    credit but not scope/interpretation credit unless it proposes the
    events proxy; executing the proxy with a stated threshold earns full
    marks. Listing the same package twice under different ids, or
    presenting world-knowledge authorship as computed from the data, are
    the failure modes.

- id: q14
  category: nuanced_answerable
  target_type: rubric
  input: "how many users does dplyr have?"
  target: |
    No user counts exist in the data, and downloads are not users. Good
    answers refuse a single user number and quantify proxies with their
    caveats: CRAN downloads (June 2026: {q14_dplyr_june}; inflated by
    CI/mirrors, not comparable to users) and/or docs-site traffic
    (dplyr.tidyverse.org, June 2026: {q14_docs_visitors_june} visitor-days;
    daily uniques, not distinct people). correct_logic = explains why a
    user count cannot be derived. filters_scope = proxies drawn from the
    right series. interpretation_limits = at least one proxy quantified
    WITH its caveat — a decline that offers proxies but delivers no
    numbers does not earn this item. fabrication = no user count presented
    as real.

- id: q15
  category: nuanced_answerable
  target_type: rubric
  input: "who are the biggest contributors to shiny?"
  target: |
    Verified, counting non-fork events across the shiny family under
    deduplication: {q15_contributors}. The exact ranking depends on
    which event types count as "contribution" and on scope: a stated
    narrower scope (e.g. a single project id or repo) is acceptable, and
    its counts will differ from the family-wide numbers above — verify
    cited counts against the solver's trajectory rather than against this
    list, and treat contributors absent from this list as real if they
    appear in the trajectory's results. The core names wch, jcheng5,
    cpsievert should surface under any reasonable basis. Comment events
    dominate the counts, so an answer that says what it counted is stronger
    than one that just ranks. Rankings must not double-count the duplicate
    project ids.
    correct_logic = contributor ranking from events with real numbers.
    filters_scope = scope stated and applied without duplicate-id
    double-count. interpretation_limits = event-type basis stated.
    fabrication = no invented contributors or counts.

- id: q16
  category: nuanced_answerable
  target_type: rubric
  input: "is positron taking off?"
  target: |
    Positron has NO download/install source in the data, and since the
    2026-07-28 refetch dropped its github history it has NO github data
    either — positron.posit.co site traffic ({q20_positron_sources}) is all
    that remains, so a good answer says growth must be read from that one
    proxy. Verified: site visitor-days grew from {q16_visitors_first} (Dec
    2024) to {q16_visitors_last} (June 2026) monthly. On 2026-06-23, overall
    site totals move from page-less daily_* rows to daily_site_* rows, while
    daily_* rows become per-page. A correctly stitched site-level series is
    comparable across that date; per-page visitor counts must not be summed.
    correct_logic = gives a verdict consistent with correctly computed
    site-level traffic and real values. filters_scope = uses page-less
    daily_* totals before 2026-06-23 and daily_site_* totals afterward, does
    not sum per-page visitor rows, and identifies partial periods when
    relevant. Do not require the final answer to explain the representation
    change when the solver trajectory handles it correctly.
    interpretation_limits = says site traffic is only a proxy and that
    install or user counts are unavailable; noticing the missing github
    history is a plus. fabrication = no invented install, user, or github
    figures or unsupported explanation for traffic changes presented as
    fact.

- id: q17
  category: nuanced_answerable
  target_type: rubric
  input: "how many cran downloads did we get yesterday?"
  target: |
    For this evaluation, the solver is told today is {eval_current_date}, so
    "yesterday" means {eval_yesterday}. {q17_coverage} Use the solver
    trajectory to check which date it queried; the answer does not need to
    repeat the date explicitly. Providing the latest available dated total
    when yesterday is unavailable is optional, not required.
    correct_logic = checks and accurately reports CRAN availability and, when
    available, the total for {eval_yesterday}. filters_scope = checks CRAN
    across the tracked packages and deduplicates if calculating a total.
    interpretation_limits = does not silently substitute a different date;
    any alternative date or value is clearly labeled. fabrication = no
    unsupported count or explanation for missing coverage.

- id: q18
  category: nuanced_answerable
  target_type: rubric
  input: "the python versions of our packages seem way more popular than the r ones. is that real?"
  target: |
    The premise holds for the newer pairs but NOT for the flagship:
    2026 YTD, {q18_pairs_ytd}. The biggest pair runs the other way:
    {q18_shiny_matched}. {q18_matched_totals} — roughly even in aggregate.
    Also, PyPI counts inflate relative to CRAN (CI, mirrors, bots), so
    download ratios are not user ratios. The best answer characterizes
    where the premise holds and where it doesn't; "yes across the board"
    misses shiny, and "it's all CI noise" overcorrects. Pairing chatlas
    with ellmer (same niche, different names) requires outside knowledge —
    bonus, not required. correct_logic = per-pair comparison with real
    numbers, including at least one counterexample or the aggregate.
    filters_scope = comparable windows; no duplicate-id double-counts.
    interpretation_limits = the CRAN/PyPI inflation caveat. fabrication =
    no invented pairs or trends.

- id: q19
  category: nuanced_answerable
  target_type: rubric
  input: "how much are we investing in python these days?"
  target: |
    Investment (spend, headcount) is not in the data. Good answers reframe
    to observable output: the PyPI-tracked roster ({q19_pypi_roster}),
    dual-language releases shipped near-simultaneously (orbital 2025-02,
    querychat 2025-03), github activity on the python repos. Known lure:
    the projects table has language tags for only a small minority
    ({q19_tags}), and the python tag misses PyPI-roster packages
    (querychat, raghilda) — treating those tags as a census understates
    the python footprint; a careful answer either avoids the tags or flags
    their sparsity. correct_logic = says investment itself is unavailable
    and uses correctly computed output proxies. filters_scope = a tag-based
    analysis passes when it is clearly labeled as covering only the tagged
    subset and is not presented as the complete Python portfolio; it need
    not enumerate every omitted project or quote the exact tag-coverage
    statistic. interpretation_limits = says spend and headcount are not
    observable and names the proxy being used. fabrication = no invented
    investment or proxy values and no unsupported claims about omitted
    projects. Calling unqueried projects inactive or archival fails this
    item; do not also fail scope when the tagged subset was clearly
    disclosed.

- id: q20
  category: not_answerable
  target_type: rubric
  input: "how many times has positron been downloaded?"
  target: |
    No download metric exists for positron anywhere in the data — its only
    source is {q20_positron_sources} (its github history was lost in the
    2026-07-28 refetch). The correct limitation: positron's distribution
    channels are not covered. Acceptable proxies if clearly labeled:
    positron.posit.co site traffic, or the openvsx extension totals for
    other projects (which are extension installs for editors, not positron
    downloads — mislabeling those as positron downloads fails provenance).
    Fabrication = any number presented as positron downloads.

- id: q21
  category: not_answerable
  target_type: rubric
  input: "how did our youtube videos do in may 2026?"
  target: |
    YouTube coverage begins 2026-06-25 and consists of cumulative lifetime
    snapshots; no May 2026 activity data exists. Correct limitation: the
    data cannot say anything about May performance. Acceptable
    clearly-labeled adjacent fact: {q21_may_videos} — current lifetime
    views of May-published videos, which is NOT May performance and must
    be labeled as current/lifetime. Fabrication or provenance failure:
    back-filling May numbers from snapshots, or presenting lifetime views
    as "how they did in May".

- id: q23
  category: not_answerable
  target_type: rubric
  input: "which countries are our users in?"
  target: |
    No geographic dimension exists in any table — site analytics arrive
    pre-aggregated without geography, and downloads/events carry no
    location. Correct limitation: geography is not in the tracked data.
    Any country breakdown is fabricated. Mentioning that the underlying
    analytics services do collect geography that isn't ingested here is
    fine, labeled as outside the data.

- id: q24
  category: nuanced_answerable
  target_type: rubric
  input: "how quickly does the tidyverse team respond to issues?"
  target: |
    Events carry the issue number (events.ref), so per-issue timelines are
    computable: pair each issue_open with the first comment on the same
    (project, target, ref). Verified for a recent window:
    {q24_response_time}. Facts for scoping: {q24_tidyverse_repos}. A stated
    different window, or time-to-close instead of time-to-first-comment
    (median ~105 hours on the same window), is equally acceptable — grade
    cited numbers against the solver's trajectory when the window differs.
    The real limitation to name: the data has no team roster, so "the team"
    cannot be separated from the wider community, and the first comment may
    be the reporter's own; unanswered issues (about a quarter here) must not
    be silently dropped from a "typical response time" claim. correct_logic
    = latency computed by pairing events on ref, not by time proximity
    between unlinked events. filters_scope = window and repo scope stated.
    interpretation_limits = names the team-identification limit or the
    unanswered-issue tail. fabrication = no invented latency and no latency
    derived from unpaired event volumes.

- id: q25
  category: not_answerable
  target_type: rubric
  input: "is dplyr losing ground to polars?"
  target: |
    polars is not a tracked project, so the comparison cannot be made from
    this data. Correct limitation: only Posit's own projects are tracked.
    Good answers answer or offer the dplyr side (e.g. dplyr's download
    trend — see that downloads are roughly flat-to-growing at ~1.8M/month)
    and decline the polars side; outside knowledge about polars, if
    offered, must be labeled as outside the data. Fabrication = invented
    polars numbers or an invented comparative trend.

- id: q26
  category: not_answerable
  target_type: rubric
  input: "how is tidymodels doing?"
  target: |
    The tidymodels family is absent from the data: no tidymodels-org repos
    are tracked, and none of its packages are among the CRAN
    download-tracked ones. Two specific lures: (1) a listed project named
    "workflows" exists but is {q26_workflows_target} — an unrelated
    name-collision, NOT tidymodels/workflows, and it carries no metrics at
    all since the 2026-07-28 refetch; reporting it as tidymodels fails
    provenance. (2) The tidyverse project IS tracked; substituting
    tidyverse numbers for tidymodels fails provenance. Correct limitation:
    this data does not cover tidymodels. An answer that says so and stops,
    or offers outside knowledge clearly labeled, is good.

- id: q27
  category: numeric
  target_type: table
  input: "which videos got the most views last month?"
  target: |
    "Last month" is July 2026, with data through July 28. Expected leaders
    by views gained: {q27_video_growth}. Full credit requires the leading
    three titles and approximately correct gains. For videos that existed
    before July, growth is the July 28 cumulative snapshot minus the latest
    pre-July snapshot. Videos published during July have a zero baseline;
    all their lifetime views through July 28 were gained in July. Excluding
    July releases or summing cumulative snapshots scores 0. The answer must
    make the July window and partial coverage identifiable.

- id: q28
  category: numeric
  target_type: table
  input: "which vscode extension has the best rating?"
  target: |
    Latest observed OpenVSX ratings: {q28_openvsx_ratings}. Air, Shiny, and
    Quarto are tied at 5.0; Air has three reviews, while Shiny and Quarto
    have two. Publisher and Shiny UI Editor have no rating. The stored
    total_ratings value is averageRating multiplied by 100, so 500 means
    5.00, not 500 ratings. Ratings are sparse and last appear on July 9;
    inspecting only the latest metrics date wrongly makes them look absent.
    The Shiny extension is collected under shiny-r and shiny-python but is
    one posit/shiny listing and must appear once. Full credit requires the
    tie, correct rating scale, and deduplication; review counts and the as-of
    date may be rounded or summarized but must not be misrepresented.

- id: q29
  category: nuanced_answerable
  target_type: rubric
  input: "how many open github issues did we have at the end of june?"
  target: |
    An exact portfolio total for June 30 cannot be recovered. {q29_issue_replay}.
    Even the deduplicated 10,031 is only a retained-history estimate: 22
    repositories lost their full GitHub histories in the July 28 refetch,
    and the event schema cannot replay every state transition. For example,
    {q29_shiny_replay}. Current content.state is authoritative for current
    state but cannot be rewound to June. correct_logic = either clearly
    declines an exact count or labels 10,031 as a retained-event estimate;
    11,310 is not a solid portfolio estimate. filters_scope = avoids
    duplicate project ids and does not use current content as historical
    state. interpretation_limits = names both the missing-history and
    incomplete-event-replay limits. fabrication = no unsupported cause for
    the discrepancy or unqualified org-wide count.

- id: q30
  category: numeric
  target_type: table
  input: "which repos have issues nobody has touched in a year?"
  target: |
    With a 2025-08-11 cutoff, expected top repositories and counts are
    {q30_stale_issues}. Use current OPEN issue state from content, deduplicate
    on (target, ref), then use the latest issue_open or comment event as the
    latest observable activity. Full credit requires the top five and
    approximately correct counts, a stated activity definition, and no
    duplicate project-id inflation. Labels, assignments, and passive triage
    are not in the event data, so "touched" is necessarily a proxy. Do not
    infer that a repository is unmaintained or abandoned from stale-issue
    counts alone.

- id: q31
  category: nuanced_answerable
  target_type: rubric
  input: "how much did our total audience grow last month?"
  target: |
    There is no additive total-audience measure: website visitors, YouTube
    subscribers, downloads, and GitHub activity represent different units
    and overlapping populations. Verified website proxy after selecting
    site-level rows and deduplicating shared targets: {q31_visitor_days}.
    These are visitor-days, not distinct people; July is partial through the
    28th and the site roster differs from June, so the monthly totals are not
    directly comparable. A daily average is acceptable if computed from
    those day counts. Separately, {q31_youtube_subscribers}; this must not be
    added to visitor-days. correct_logic = declines a single combined growth
    figure and offers only separately labeled proxies. filters_scope = any
    website calculation uses site-level rows and deduplicates project ids.
    interpretation_limits = calls summed visitors visitor-days and identifies
    July's partial coverage. fabrication = no per-page summing, cross-channel
    addition, or claim of monthly unique people.

- id: q32
  category: nuanced_answerable
  target_type: rubric
