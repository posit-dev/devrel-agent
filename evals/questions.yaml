# The eval dataset. Questions are deliberately colloquial and under-specified;
# each target block tells the grader the accepted interpretations, the expected
# values or facts under each, and any score adjustments. {placeholders} are
# interpolated from evals/targets.yaml (authored/audited by evals/targets.R
# against the same snapshot the solver queries).
#
# categories: numeric (percent-error tools; target_type numeric or table) |
# nuanced_answerable, not_answerable (binary rubric via submit_grade).

- id: q01
  category: numeric
  target_type: numeric
  input: "how many downloads did dplyr get in june?"
  target: |
    Accepted interpretations: June 2026 (most recent complete June), expected
    {q01_june_2026} CRAN downloads; June 2025, expected {q01_june_2025}. The
    year must be identifiable from the answer. The data's June 2026 series is
    missing 2026-06-30 (a known collection gap), so an answer that flags a
    possible small undercount is fine and must not be penalized. Mentioning
    that these are CRAN downloads (dplyr is not on PyPI here) or that download
    counts include CI/mirror traffic is good practice, not required.

- id: q02
  category: nuanced_answerable
  target_type: rubric
  input: "are dplyr downloads still growing?"
  target: |
    Any clearly stated window, computed correctly, passes; the horizons
    genuinely disagree, so the direction claim is graded for consistency with
    the values cited, not against a single right answer. Verified series
    (CRAN daily downloads summed by period): monthly {q02_monthly}. Yearly:
    {q02_yearly} (2026 is partial). So: June 2026 vs June 2025 is up ~33%;
    the three most recent complete months decline; the decade view grew
    enormously to a 2022 peak and has plateaued since. The best answers note
    more than one horizon. Cited values must match the series above within
    rounding. The answer should not present a single horizon's direction as
    the whole story without naming its window.

- id: q03
  category: numeric
  target_type: numeric
  input: "how many people have visited shiny.posit.co this year?"
  target: |
    Expected: {q03_ytd_visitor_days} visitor-days, 2026 year-to-date through
    the snapshot. Required for full credit, beyond the number: (a) the answer
    frames the total as summed daily visitors (visitor-days), NOT unique
    people — daily uniques do not deduplicate across days; if it presents the
    number as distinct people or "unique visitors", cap the score at 0.5.
    (b) Site coverage begins 2026-03-02, so "this year" cannot include
    January-February; noting this is worth mentioning but its absence should
    only reduce the score slightly (multiply by 0.9), not fail the answer.
    Known wrong answers: ~{q03_double_count} arises from double-counting the
    site's duplicate project ids — score 0; a much larger all-sites total
    (~2.4M) arises from dropping the site filter — score 0.

- id: q04
  category: numeric
  target_type: table
  input: "what got the most stars on github this year?"
  target: |
    Expected leaderboard, 2026 year-to-date through the snapshot,
    deduplicated: {q04_leaderboard}. Grade the depth the answer actually
    gives (a correct top 3 in prose is fine): required labels are the
    projects in order; score each cited count with percent_error_score and
    average. Wrong order or missing top entries lowers the score. The window
    should be identifiable from the answer ("this year" restated, or dates
    given); a different stated recent window is acceptable if the entries
    are plausible under it — grade values only where they match a stated
    window, and cap at 0.5 if no window is identifiable.

- id: q05
  category: numeric
  target_type: numeric
  input: "how many views does our youtube channel have?"
  target: |
    Two verified-correct operationalizations, both acceptable: the latest
    channel-total snapshot, {q05_channel_views} (as of {q05_channel_asof}),
    or the sum of each video's latest snapshot, {q05_per_video_sum}. These
    are lifetime cumulative counts. Full credit requires an as-of date (or
    equivalent "as of the latest data") somewhere in the answer; cap at 0.8
    without one. A vastly larger figure (tens of millions or more) means
    daily snapshots were summed over time — score 0.

- id: q06
  category: numeric
  target_type: table
  input: "what are people actually looking at on the shiny site?"
  target: |
    Top pages on shiny.posit.co by pageviews, any stated window. Expected,
    last 31 days of coverage: {q06_pages_last31}. Expected, full per-page
    coverage (2026-03-02 onward; identical to 2026 YTD): {q06_pages_full}.
    Grade the cited counts against the stated window's table. The site's
    rows are duplicated under two project ids: answers roughly DOUBLE these
    values (e.g. homepage ~25,990 on the 31-day window) double-counted the
    duplicate id — score 0 for the values even if the page ranking is right,
    since the ranking survives the double-count. Page identity and order
    matter: homepage first, then the get-started lesson, then the gallery.
    Noting the R vs Python section split is a plus, not required.

- id: q07
  category: numeric
  target_type: table
  input: "which of our youtube videos is the most popular?"
  target: |
    Expected: {q07_top_video} (lifetime cumulative views, latest snapshot;
    runner-up {q07_runner_up}). The title (or an unambiguous reference to
    it) and a view count near the expected value are both required. Lifetime
    views are answerable even though tracking began 2026-06-25, because
    snapshots are cumulative — an answer that wrongly declines for that
    reason scores 0.25. An answer using a stated alternative reading
    ("most popular lately" via growth over the tracked window) is
    acceptable if the window is stated and the pick is defensible from the
    data.

- id: q08
  category: numeric
  target_type: table
  input: "how many downloads do we get in a month?"
  target: |
    Expected for June 2026 (most recent complete month): CRAN
    {q08_cran_june}, PyPI {q08_pypi_june}. Required: the scope is stated
    (which registries, which month or average window), and the two channels
    are reported per-channel or with an explicit note that their counting
    semantics differ — a single silent combined total caps the score at
    0.5. A different stated recent month or a stated multi-month average is
    acceptable; grade cited values for internal consistency and plausibility
    against the June anchors (within ~25% for nearby months). CRAN-only
    answers are fine if stated as CRAN-only. Small stated undercount caveats
    (missing CRAN days) are fine.

- id: q09
  category: numeric
  target_type: table
  input: "how's orbital been doing since we launched it?"
  target: |
    Orbital is a package for translating tidymodels workflows to SQL,
    shipped in R and Python. Verified facts: {q09_cran}. {q09_pypi}.
    {q09_stars}. "Since we launched it" has no single data-derivable
    anchor (the CRAN series predates the PyPI series by a year; github
    events for the orbital ids begin 2025-02-25), so accept any stated
    anchor: since CRAN release, since 2025-02-25, since PyPI coverage, or
    2026 YTD. Required: per-channel numbers consistent with the stated
    anchor (grade with percent_error_score against the matching facts),
    and the two registries not silently combined. Star counts, if given,
    should be near the deduplicated value, not the naive triple-count.

- id: q10
  category: nuanced_answerable
  target_type: rubric
  input: "traffic to the shiny site looks weird around the end of june 2026. what happened?"
  target: |
    The correct explanation is a measurement change on 2026-06-23 — the
    devrel data collection migrated systems — not an audience event. Two
    true mechanisms, either or both acceptable: (a) metric series for the
    site change shape at the seam (on one of the site's two project ids,
    daily_site_* series only begin 2026-06-23); (b) the site's rows are
    duplicated under two project ids from 2026-06-23, so naive sums across
    ids roughly double overnight (site pageviews jump from ~4.5k to ~9k/day).
    Under the site's primary id the series is actually continuous from
    2026-03-02. Failure modes: inventing a launch/marketing narrative for
    the jump; presenting the doubled numbers as a real audience change.
    correct_logic = names the measurement migration or duplication, not an
    audience story. filters_scope = anchors to the right date (2026-06-23)
    and the right site. interpretation_limits = says what the "weirdness"
    concretely is in the data. fabrication = no invented events.

- id: q11
  category: nuanced_answerable
  target_type: rubric
  input: "is shiny for python catching up with regular shiny?"
  target: |
    Verified facts: {q11_downloads_matched} — a ratio around 0.4, with no
    convergence trend within the matched window. Stars tell a friendlier
    story for python: yearly stars gained, {q11_stars_yearly}. PyPI and
    CRAN download counts are not directly comparable (different mirror/CI
    inflation), and the site and repos are tracked under duplicate ids that
    must not be double-counted. A defensible answer can conclude "no, not
    on downloads", "yes on github momentum", or a mixed verdict — grade the
    measures actually named and their numbers, not the verdict.
    correct_logic = compares like against like with real numbers.
    filters_scope = matched or stated windows; no duplicate-id
    double-count. interpretation_limits = names its measures and the
    CRAN/PyPI incomparability. fabrication = no invented trends.

- id: q12
  category: nuanced_answerable
  target_type: rubric
  input: "which of hadley's packages from the last couple years have taken off the most?"
  target: |
    Expected core: ellmer (hadley's, released ~2024; {q12_ellmer_cran}
    lifetime CRAN downloads; heavy hadley activity — {q12_hadley_events}
    events by hadley among recent candidates). If the answer's stated
    measure includes github signals, ggsql also qualifies (hadley's,
    2025-12, {q12_ggsql_stars} stars in 2026, no CRAN presence — invisible
    to a downloads-only measure, which is a legitimate consequence of a
    stated measure). Known lures: btw and mcptools have NO hadley events in
    the data, and vitals/shinychat/querychat have almost none (4/1/1) —
    attributing these to hadley via unchecked world knowledge is the main
    failure. Attribution must be stated AND grounded: either checked
    against contributor activity in the events data, or explicitly labeled
    as outside-the-data knowledge. correct_logic = right core answer with
    real numbers. filters_scope = "last couple years" respected; the
    measure's blind spots acknowledged if relevant. interpretation_limits =
    states how "hadley's" and "taken off" were operationalized.
    fabrication = no unchecked attribution presented as fact.

- id: q13
  category: nuanced_answerable
  target_type: rubric
  input: "which packages have joe and hadley co-authored?"
  target: |
    Formal authorship metadata does not exist in this data; the honest
    in-data proxy is contributor activity in the events table
    (events.username; "joe" = Joe Cheng = jcheng5). Verified joint PR
    activity (pr_open + pr_merge, all project ids): {q13_joint_pr}. Note:
    the shiny repo appears under multiple ids and one of them attributes
    almost all PR events to the literal username "unknown" — answers using
    that id may honestly report much lower joint counts for shiny; both
    bases are acceptable if the answer says what it counted. Grade on
    tiers via the rubric items: an honest decline that names the missing
    authorship metadata earns identifies-correct-logic and fabrication
    credit but not scope/interpretation credit unless it proposes the
    events proxy; executing the proxy with a stated threshold earns full
    marks. Listing the same package twice under different ids, or
    presenting world-knowledge authorship as computed from the data, are
    the failure modes.

- id: q14
  category: nuanced_answerable
  target_type: rubric
  input: "how many users does dplyr have?"
  target: |
    No user counts exist in the data, and downloads are not users. Good
    answers refuse a single user number and quantify proxies with their
    caveats: CRAN downloads (June 2026: {q14_dplyr_june}; inflated by
    CI/mirrors, not comparable to users) and/or docs-site traffic
    (dplyr.tidyverse.org, June 2026: {q14_docs_visitors_june} visitor-days;
    daily uniques, not distinct people). correct_logic = explains why a
    user count cannot be derived. filters_scope = proxies drawn from the
    right series. interpretation_limits = at least one proxy quantified
    WITH its caveat — a decline that offers proxies but delivers no
    numbers does not earn this item. fabrication = no user count presented
    as real.

- id: q15
  category: nuanced_answerable
  target_type: rubric
  input: "who are the biggest contributors to shiny?"
  target: |
    Verified, counting non-star non-fork events across the shiny family
    under deduplication: {q15_contributors}. The literal username "unknown"
    appears high in any such ranking — it is an attribution artifact, and a
    good answer excludes or flags it rather than reporting it as a person.
    The shiny repo is tracked under multiple project ids; rankings must not
    double-count them. The exact ranking depends on which event types count
    as "contribution" (PR-only rankings put wch first with jcheng5 and
    cpsievert following; including issues shifts counts but not the core
    names) — accept any stated basis whose numbers check out; the core
    names wch, jcheng5, cpsievert, schloerke should surface.
    correct_logic = contributor ranking from events with real numbers.
    filters_scope = no duplicate-id double-count; event-type basis stated.
    interpretation_limits = "unknown" handled; basis stated. fabrication =
    no invented contributors or counts.

- id: q16
  category: nuanced_answerable
  target_type: rubric
  input: "is positron taking off?"
  target: |
    Positron has NO download/install source in the data (github + site
    traffic only) — a good answer says growth must be read from proxies.
    Verified: site visitor-days grew from {q16_visitors_first} (Dec 2024)
    to {q16_visitors_last} (June 2026) monthly; github activity is
    sustained. Data artifacts the grader must respect: {q16_star_gap} — a
    collection hole, NOT a real star drought; and the site series changes
    collection basis at the 2026-06-23 seam. An answer citing gap-shaped
    star numbers is using flawed-but-real data, not fabricating; noticing
    the gap is bonus. correct_logic = growth read from stated signals with
    real numbers. filters_scope = respects coverage windows.
    interpretation_limits = names the no-installs limit. fabrication = no
    invented install/user figures.

- id: q17
  category: nuanced_answerable
  target_type: rubric
  input: "how many cran downloads did we get yesterday?"
  target: |
    The agent has no clock, and CRAN data lags the snapshot: {q17_latest_cran}
    (the snapshot's other sources reach one day later). The ideal answer
    reports the most recent available day, DATED, and notes that CRAN
    reporting lags so "yesterday" may not be loaded yet; scope (the ~13
    tracked CRAN packages, deduplication) stated or implied correctly.
    correct_logic = latest-day total consistent with the verified value.
    filters_scope = across tracked packages, deduplicated (or a stated
    narrower scope). interpretation_limits = the date is explicit and the
    lag acknowledged. fabrication = does not present the latest row as
    literally yesterday's calendar total without the caveat.

- id: q18
  category: nuanced_answerable
  target_type: rubric
  input: "the python versions of our packages seem way more popular than the r ones. is that real?"
  target: |
    The premise holds for the newer pairs but NOT for the flagship:
    2026 YTD, {q18_pairs_ytd}. The biggest pair runs the other way:
    {q18_shiny_matched}. {q18_matched_totals} — roughly even in aggregate.
    Also, PyPI counts inflate relative to CRAN (CI, mirrors, bots), so
    download ratios are not user ratios. The best answer characterizes
    where the premise holds and where it doesn't; "yes across the board"
    misses shiny, and "it's all CI noise" overcorrects. Pairing chatlas
    with ellmer (same niche, different names) requires outside knowledge —
    bonus, not required. correct_logic = per-pair comparison with real
    numbers, including at least one counterexample or the aggregate.
    filters_scope = comparable windows; no duplicate-id double-counts.
    interpretation_limits = the CRAN/PyPI inflation caveat. fabrication =
    no invented pairs or trends.

- id: q19
  category: nuanced_answerable
  target_type: rubric
  input: "how much are we investing in python these days?"
  target: |
    Investment (spend, headcount) is not in the data. Good answers reframe
    to observable output: the PyPI-tracked roster ({q19_pypi_roster}),
    dual-language releases shipped near-simultaneously (orbital 2025-02,
    querychat 2025-03), github activity on the python repos. Known lure:
    the projects table has language tags for only a small minority
    ({q19_tags}), and the python tag misses PyPI-roster packages
    (querychat, raghilda) — treating those tags as a census understates
    the python footprint; a careful answer either avoids the tags or flags
    their sparsity. correct_logic = output proxies, correctly computed.
    filters_scope = does not present the sparse tag census as complete.
    interpretation_limits = says investment itself is not observable here.
    fabrication = no invented spend/headcount figures.

- id: q20
  category: not_answerable
  target_type: rubric
  input: "how many times has positron been downloaded?"
  target: |
    No download metric exists for positron anywhere in the data — its only
    sources are {q20_positron_sources}. The correct limitation: positron's
    distribution channels are not covered. Acceptable proxies if clearly
    labeled: positron.posit.co site traffic, github stars/activity, the
    openvsx extension totals (which are extension installs for editors,
    not positron downloads — mislabeling those as positron downloads fails
    provenance). Fabrication = any number presented as positron downloads.

- id: q21
  category: not_answerable
  target_type: rubric
  input: "how did our youtube videos do in may 2026?"
  target: |
    YouTube coverage begins 2026-06-25 and consists of cumulative lifetime
    snapshots; no May 2026 activity data exists. Correct limitation: the
    data cannot say anything about May performance. Acceptable
    clearly-labeled adjacent fact: {q21_may_videos} — current lifetime
    views of May-published videos, which is NOT May performance and must
    be labeled as current/lifetime. Fabrication or provenance failure:
    back-filling May numbers from snapshots, or presenting lifetime views
    as "how they did in May".

- id: q22
  category: not_answerable
  target_type: rubric
  input: "what fraction of our github stars come from enterprise users?"
  target: |
    No user attributes exist anywhere in the data (star events carry a
    username at most; no company, domain, or account-type information).
    Correct limitation: user segmentation is not derivable. There is no
    good proxy; an answer inventing a segmentation heuristic and reporting
    a fraction fails fabrication. Total star counts, offered as context
    and labeled, are fine.

- id: q23
  category: not_answerable
  target_type: rubric
  input: "which countries are our users in?"
  target: |
    No geographic dimension exists in any table — site analytics arrive
    pre-aggregated without geography, and downloads/events carry no
    location. Correct limitation: geography is not in the tracked data.
    Any country breakdown is fabricated. Mentioning that the underlying
    analytics services do collect geography that isn't ingested here is
    fine, labeled as outside the data.

- id: q24
  category: not_answerable
  target_type: rubric
  input: "how quickly does the tidyverse team respond to issues?"
  target: |
    The events data has issue_open and issue_comment volumes but NO issue
    identifier, so per-issue response latency cannot be computed — pairing
    events by time proximity to invent a latency is the fabrication mode.
    Correct limitation: events cannot be linked into per-issue timelines.
    Acceptable labeled proxies: open/close/comment volumes. Facts for
    proxy-checking: {q24_tidyverse_repos}; also, comment events END at
    2026-06-22 (collection change), so recent "responsiveness" volume
    trends are compromised — a proxy-delivering answer should not present
    post-June comment volumes as current.

- id: q25
  category: not_answerable
  target_type: rubric
  input: "is dplyr losing ground to polars?"
  target: |
    polars is not a tracked project, so the comparison cannot be made from
    this data. Correct limitation: only Posit's own projects are tracked.
    Good answers answer or offer the dplyr side (e.g. dplyr's download
    trend — see that downloads are roughly flat-to-growing at ~1.8M/month)
    and decline the polars side; outside knowledge about polars, if
    offered, must be labeled as outside the data. Fabrication = invented
    polars numbers or an invented comparative trend.

- id: q26
  category: not_answerable
  target_type: rubric
  input: "how is tidymodels doing?"
  target: |
    The tidymodels family is absent from the data: no tidymodels-org repos
    are tracked, and none of its packages are among the CRAN
    download-tracked ones. Two specific lures: (1) a tracked project named
    "workflows" exists but is {q26_workflows_target} — an unrelated
    name-collision, NOT tidymodels/workflows; reporting it as tidymodels
    fails provenance. (2) The tidyverse project IS tracked; substituting
    tidyverse numbers for tidymodels fails provenance. Correct limitation:
    this data does not cover tidymodels. An answer that says so and stops,
    or offers outside knowledge clearly labeled, is good.
